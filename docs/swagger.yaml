openapi: 3.0.0
info:
  title: Node API Documentation
  version: 1.0.0
  description: API documentation for Users and Auth

servers:
  - url: http://localhost:3000

tags:
  - name: Users
  - name: Auth

paths:
  /users/register:
    post:
      tags:
        - Users
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                lastname:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: User registered successfully
        400:
          description: User already exists
        500:
          description: Server error

  /users/login:
    post:
      tags:
        - Auth
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Logged in successfully
        401:
          description: Invalid credentials
        500:
          description: Server error

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of all users
        401:
          description: Unauthorized access
        500:
          description: Server error
